name: MSM8916 - 3.10

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-17.1

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential zip curl git python3

      - name: Jalankan build.sh
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Flashable-Zip
          path: ./*.zip
          retention-days: 7
